name: "System-Diagnostics-Stealth-Build"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install ldid zstd xz

      - name: PHASE 0 - Download Assets
        run: |
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          gh release download v1 --pattern "Crane.deb" --repo ${{ github.repository }}
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PHASE 1 - Basebin Surgery (Strict Control)
        run: |
          set -e
          set -x
          # Tìm thư mục chứa lõi Hook
          HOOK_LIB=$(grep -lR "TweakInject" temp | head -n 1)
          if [ -z "$HOOK_LIB" ]; then 
            HOOK_LIB=$(grep -lR "rootless" temp | grep -v ".plist" | head -n 1)
          fi
          
          # Kiểm tra tệp mục tiêu trước khi vá
          if [ ! -f "$HOOK_LIB" ]; then
            echo "❌ CRITICAL ERROR: Không tìm thấy file Basebin tại $HOOK_LIB"
            exit 1
          fi

          python3 - <<EOF
          import os
          path = "$HOOK_LIB"
          with open(path, "rb") as f: data = f.read()
          new_data = data.replace(b"TweakInject", b"DiagInject")
          if b"DiagInject" not in new_data:
              print("❌ ERROR: Patch chuỗi thất bại!")
              exit(1)
          with open(path, "wb") as f: f.write(new_data)
          EOF

          # Ký số bắt buộc, không được bỏ qua
          ldid -S "$HOOK_LIB"
          echo "✅ Phase 1: Basebin vá và ký số thành công!"

      - name: PHASE 2 - Crane Pro Surgery (Strict Validation)
        run: |
          set -e
          set -x
          # 1. Kiểm tra môi trường
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ LỖI: Không thấy APP_DIR"; exit 1; fi
          
          if [ ! -f "Crane.deb" ]; then echo "❌ LỖI: Thiếu file đầu vào Crane.deb"; exit 1; fi

          mkdir -p crane_work && cd crane_work
          
          # 2. Giải nén lớp 1: ar
          ar x ../Crane.deb
          if [ ! -f "data.tar.zst" ] && [ ! -f "data.tar.xz" ] && [ ! -f "data.tar.gz" ]; then
            echo "❌ LỖI: Giải nén ar thất bại, không tìm thấy tệp data"
            exit 1
          fi

          # 3. Giải nén lớp 2: zstd/xz/gz về data.tar (Kiểm tra tồn tại từng bước)
          if [ -f "data.tar.zst" ]; then
            zstd -d data.tar.zst --stdout > data.tar
          elif [ -f "data.tar.xz" ]; then
            xz -d data.tar.xz --stdout > data.tar
          elif [ -f "data.tar.gz" ]; then
            gunzip -c data.tar.gz > data.tar
          fi

          if [ ! -f "data.tar" ]; then 
            echo "❌ LỖI TRỌNG YẾU: data.tar không tồn tại sau khi giải nén lớp 2"
            exit 1 
          fi

          # 4. Giải nén lớp 3: tar
          tar -xf data.tar
          
          # 5. Truy vết Core Dylib (Kiểm tra dung lượng > 0)
          TARGET_DYLIB=$(find . -name "*.dylib" ! -name "*SB*" ! -name "*Prefs*" -type f -exec du -b {} + | sort -n -r | head -n 1 | awk '{print $2}')
          if [ -z "$TARGET_DYLIB" ] || [ ! -s "$TARGET_DYLIB" ]; then
            echo "❌ LỖI: Core Dylib trống hoặc không tìm thấy"
            exit 1
          fi
          echo "🎯 ĐÃ KHÓA MỤC TIÊU: $TARGET_DYLIB"

          # 6. Vá Hex và di chuyển (Bảo toàn dữ liệu)
          cd ..
          python3 -c "
          import os
          path = 'crane_work/$TARGET_DYLIB'
          with open(path, 'rb') as f: data = f.read()
          data = data.replace(b'com.opa334.crane', b'com.apple.diagsv1')
          data = data.replace(b'libcrane.dylib', b'libdiagsv1.dylib')
          with open(path, 'wb') as f: f.write(data)
          "

          mkdir -p "$APP_DIR/DiagInject"
          cp "crane_work/$TARGET_DYLIB" "$APP_DIR/DiagInject/libdiagsv1.dylib"
          
          # Kiểm tra file sau khi di chuyển có bị 0kb không
          if [ ! -s "$APP_DIR/DiagInject/libdiagsv1.dylib" ]; then
            echo "❌ LỖI: libdiagsv1.dylib bị 0kb sau khi copy"
            exit 1
          fi

          # 7. Ký số bắt buộc (Dùng -S để nhúng quyền)
          ldid -e "$APP_DIR/DiagInject/libdiagsv1.dylib" > ent.xml || echo "<dict></dict>" > ent.xml
          ldid -Sent.xml "$APP_DIR/DiagInject/libdiagsv1.dylib"
          
          echo "✅ Phase 2: Phẫu thuật lõi thành công, tệp tin đạt chuẩn!"

      - name: 📥 Upload Final Tipa
        uses: actions/upload-artifact@v4
        with:
         name: Diagnostics-Stealth-Final
         path: Diagnostics_Signature_Safe.tipa
