name: "System-Diagnostics-Stealth-Ultimate"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install ldid

      - name: PHASE 0 - Extraction
        run: |
          set -e
          # Tải phôi Dopamine gốc
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PHASE 1 - Deep Stealth Surgery (Vỏ Tàng Hình)
        run: |
          set -e
          set -x
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          [ -z "$APP_DIR" ] && { echo "❌ LỖI: Không tìm thấy APP_DIR"; exit 1; }
          INFO_PLIST="$APP_DIR/Info.plist"

          # 1. Đổi tên Binary thực thi (Xóa sạch dấu vết 'Dopamine')
          OLD_EXEC=$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")
          mv "$APP_DIR/$OLD_EXEC" "$APP_DIR/Diagnostics"
          plutil -replace CFBundleExecutable -string "Diagnostics" "$INFO_PLIST"

          # 2. Thay đổi Metadata giả danh App hệ thống Apple
          plutil -replace CFBundleIdentifier -string "com.apple.diagsv1.manager" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "Diagnostics" "$INFO_PLIST"
          
          # 3. URL Schemes giả danh Store (Cố định lỗi bị cụt dòng)
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.diagsv1</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"

          # 4. Thay đổi Icon bánh răng (Yêu cầu file AppIcon60x60@2x.png có sẵn trong Repo)
                 # 3. Xử lý Icon tàng hình & Chống văng App (K-Sentinel Optimize)
          # Đổi tên Assets.car thay vì xóa để tránh văng App khi nạp tài nguyên
          mv "$APP_DIR/Assets.car" "$APP_DIR/Assets.car.bak" || true
          
          if [ -f "AppIcon60x60@2x.png" ]; then
            cp AppIcon60x60@2x.png "$APP_DIR/AppIcon60x60.png"
            cp AppIcon60x60@2x.png "$APP_DIR/AppIcon60x60@2x.png"
            
            # Cấu hình Info.plist ép iOS đọc file ảnh lẻ thay vì tìm trong Assets.car
            plutil -remove CFBundleIcons "$INFO_PLIST" || true
            plutil -insert CFBundleIcons -xml "<dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array><key>UIPrerenderedIcon</key><true/></dict></dict>" "$INFO_PLIST"
          else
            echo "⚠️ Cảnh báo: Không tìm thấy file Icon bánh răng!"
          fi

          # 5. Ký số nghiêm ngặt (Bắt buộc phải thành công để Jailbreak được)
          # Trích xuất quyền gốc và ký lại
          ldid -e "$APP_DIR/Diagnostics" > ent.xml
          ldid -Sent.xml "$APP_DIR/Diagnostics"
          
          # Kiểm tra file sau khi ký (Nếu 0kb sẽ tự sát)
          [ ! -s "$APP_DIR/Diagnostics" ] && { echo "❌ LỖI: File thực thi bị hỏng (0kb)!"; exit 1; }

          # Tạo sẵn thư mục chờ DiagInject cho việc vá Crane thủ công sau này
          mkdir -p "$APP_DIR/DiagInject"
          echo "✅ Hoàn tất Vỏ Tàng Hình đạt chuẩn K-Sentinel."

      - name: PHASE 2 - Secure Packaging
        run: |
          set -e
          cd temp && zip -qr ../Diagnostics_Stealth_Final.tipa Payload
          echo "🚀 Đã đóng gói thành công bản Stealth Ultimate!"

      - name: 📥 Upload Stealth Build
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostics-Stealth-Ultimate
          path: Diagnostics_Stealth_Final.tipa

