name: "System-Diagnostics-Stealth-Build"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install ldid zstd xz

      - name: PHASE 0 Download
        run: |
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          gh release download v1 --pattern "Crane.deb" --repo ${{ github.repository }}
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Phase 1 - Basebin Surgery
        run: |
          set -x
          HOOK_LIB=$(grep -lR "TweakInject" temp | head -n 1)
          if [ -z "$HOOK_LIB" ]; then HOOK_LIB=$(grep -lR "rootless" temp | grep -v ".plist" | head -n 1); fi
          python3 - <<EOF
          path = "$HOOK_LIB"
          with open(path, "rb") as f: data = f.read()
          with open(path, "wb") as f: f.write(data.replace(b"TweakInject", b"DiagInject"))
          EOF
          ldid -S "$HOOK_LIB"

      - name: Phase 2 - Crane Pro Core Surgery
        run: |
          set -x
          # 1. Cài đặt công cụ
          brew install ldid zstd xz
          
          # 2. Định vị App chính
          APP_DIR=$(find temp -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ LỖI: Không tìm thấy APP_DIR"; exit 1; fi

          # 3. Giải nén Crane.deb (Chuẩn Havoc)
          mkdir -p crane_work
          cp Crane.deb crane_work/
          cd crane_work
          ar x Crane.deb
          if [ -f "data.tar.zst" ]; then
            zstd -d data.tar.zst --stdout > data.tar
          elif [ -f "data.tar.xz" ]; then
            xz -d -c data.tar.xz > data.tar
          fi
          tar -xf data.tar
          cd ..

          echo "📋 DANH SÁCH FILE VÀ DUNG LƯỢNG ĐỂ LOẠI TRỪ:"
          find crane_work -name "*.dylib" -exec ls -lh {} +

          # 4. CHỌN MỤC TIÊU: Loại bỏ CraneSB và chọn file nặng nhất (thường là libcrane hoặc Crane)
          TARGET_DYLIB=$(find crane_work -name "*.dylib" ! -name "*SB*" -type f -exec ls -s {} + | sort -n -r | head -n 1 | awk '{print $2}')
          
          if [ -z "$TARGET_DYLIB" ]; then
            echo "❌ LỖI: Không tìm thấy file Core Dylib phù hợp!"
            exit 1
          fi
          echo "🎯 ĐÃ KHÓA MỤC TIÊU CORE: $TARGET_DYLIB"

          # 5. PHẪU THUẬT BINARY
          python3 - <<EOF
          import os
          path = "$TARGET_DYLIB"
          if os.path.exists(path):
              with open(path, "rb") as f: data = f.read()
              # Vá Identifier và tên
              data = data.replace(b"com.opa334.crane", b"com.apple.diagsv1")
              data = data.replace(b"libcrane.dylib", b"libdiagsv1.dylib")
              data = data.replace(b"Crane.dylib", b"Diagsv1.dylib")
              with open(path, "wb") as f: f.write(data)
              print("✅ Đã vá Hex thành công")
          EOF

          # 6. TIÊM VÀ KÝ (Xác nhận trước khi ký)
          mkdir -p "$APP_DIR/DiagInject"
          mv "$TARGET_DYLIB" "$APP_DIR/DiagInject/libdiagsv1.dylib"
          
          echo "🛡️ ĐANG KÝ LẠI FILE: $APP_DIR/DiagInject/libdiagsv1.dylib"
          ldid -S "$APP_DIR/DiagInject/libdiagsv1.dylib"
          
          if [ $? -eq 0 ]; then
            echo "✅ XÁC NHẬN: Phase 2 thành công rực rỡ!"
          else
            echo "❌ LỖI: ldid không thể ký file. Có thể file bị hỏng hoặc chọn nhầm file rác."
            exit 1
          fi


      - name: Phase 3 - Metadata Sync
        run: |
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_DIR/Info.plist"
          plutil -replace CFBundleIdentifier -string "com.apple.diagsv1.manager" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "Diagnostics" "$INFO_PLIST"
          OLD_EXEC=$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")
          mv "$APP_DIR/$OLD_EXEC" "$APP_DIR/Diagnostics"
          plutil -replace CFBundleExecutable -string "Diagnostics" "$INFO_PLIST"
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.diagsv1</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"
          rm -f "$APP_DIR/Assets.car"
          ldid -e "$APP_DIR/Diagnostics" > ent.xml
          ldid -Sent.xml "$APP_DIR/Diagnostics"
          cd temp && zip -qr ../Diagnostics_Stealth_Final.tipa Payload

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostics-Final-Surgical
          path: Diagnostics_Stealth_Final.tipa
