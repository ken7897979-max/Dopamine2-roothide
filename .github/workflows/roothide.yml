name: "System-Diagnostics-Stealth-Build"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Signing Tools
        run: brew install ldid

      - name: 📥 PHASE 0: Download Assets (Author-Compatible)
        run: |
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          gh release download v1 --pattern "Crane.deb" --repo ${{ github.repository }}
          # Đổi tên tipa về chuẩn để dễ xử lý
          mv *.tipa Dopamine.tipa
          unzip -q Dopamine.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛡️ PHASE 1: Basebin Surgery (Deep Scan)
        run: |
          set -x
          # Tự động tìm đường dẫn chứa basebin theo cấu trúc tác giả
          BASEBIN_PATH=$(find temp -name "basebin" -type d | head -n 1)
          HOOK_LIB=$(find "$BASEBIN_PATH" -name "systemhook*.dylib" | head -n 1)
          
          if [ -z "$HOOK_LIB" ]; then echo "❌ BASEBIN NOT FOUND!"; exit 1; fi
          
          python3 - <<EOF
          path = "$HOOK_LIB"
          with open(path, "rb") as f: data = f.read()
          # TweakInject (11) -> DiagInject (11)
          if b"TweakInject" in data:
              new_data = data.replace(b"TweakInject", b"DiagInject")
              with open(path, "wb") as f: f.write(new_data)
              print("✅ Basebin Hook Patched")
          EOF
          strings "$HOOK_LIB" | grep "DiagInject" || exit 1

      - name: 🛠️ PHASE 2: Crane Stealth Surgery
        run: |
          set -x
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          mkdir -p crane_work
          ar x Crane.deb --output=crane_work
          tar -xf crane_work/data.tar.* -C crane_work
          
          ORIG_DYLIB=$(find crane_work -name "Crane.dylib")
          PREFS_BIN=$(find crane_work -name "CranePrefs")
          
          python3 - <<EOF
          def patch(p, o, n):
              with open(p, "rb") as f: d = f.read()
              if o in d:
                  with open(p, "wb") as f: f.write(d.replace(o, n))
          
          # Identifier & Dylib Name
          for f in ["$ORIG_DYLIB", "$PREFS_BIN"]:
              patch(f, b"com.opa334.crane", b"com.apple.diagsv1")
              patch(f, b"Crane.dylib", b"Diagsv1.dylib")
          EOF
          
          mkdir -p "$APP_DIR/DiagInject"
          mv "$ORIG_DYLIB" "$APP_DIR/DiagInject/Diagsv1.dylib"
          ldid -S "$APP_DIR/DiagInject/Diagsv1.dylib"

      - name: 🎭 PHASE 3: Metadata Sync (Tác giả Style)
        run: |
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_DIR/Info.plist"
          
          # Đổi tên và Identifier đồng bộ
          plutil -replace CFBundleIdentifier -string "com.apple.diagsv1.manager" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "Diagnostics" "$INFO_PLIST"
          
          # Fake URL Schemes
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.diagsv1</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"
          
          # Xử lý Executable
          OLD_EXEC=$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")
          mv "$APP_DIR/$OLD_EXEC" "$APP_DIR/Diagnostics"
          plutil -replace CFBundleExecutable -string "Diagnostics" "$INFO_PLIST"
          
          # Re-sign & Pack
          rm -rf "$APP_DIR/Assets.car"
          ldid -e "$APP_DIR/Diagnostics" > ent.xml
          ldid -Sent.xml "$APP_DIR/Diagnostics"
          cd temp && zip -qr ../Diagnostics_Surgical_Final.tipa Payload

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostics-Surgical-Final
          path: Diagnostics_Surgical_Final.tipa
