name: "System-Diagnostics-Stealth-Build"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Signing Tools
        run: brew install ldid

      - name: 📥 PHASE 0: Download & Prepare
        run: |
          # Tải tệp từ Release v1 của bạn
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          gh release download v1 --pattern "Crane.deb" --repo ${{ github.repository }}
          
          # Đổi tên tệp tipa bất kỳ thành gốc để xử lý
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛡️ PHASE 1: Basebin Surgery (Precise Path)
        run: |
          set -x
          # Dò tìm file systemhook dựa trên cấu trúc phân rã của RootHide
          # Quét tất cả các file .dylib trong mọi thư mục con của temp
          HOOK_LIB=$(find temp -name "systemhook*.dylib" -type f | head -n 1)
          
          if [ -z "$HOOK_LIB" ]; then 
            echo "❌ KHÔNG TÌM THẤY SYSTEMHOOK!"; 
            exit 1; 
          fi
          
          echo "Target Hook: $HOOK_LIB"
          
          python3 - <<EOF
          path = "$HOOK_LIB"
          with open(path, "rb") as f: data = f.read()
          # TweakInject (11) -> DiagInject (11)
          if b"TweakInject" in data:
              new_data = data.replace(b"TweakInject", b"DiagInject")
              with open(path, "wb") as f: f.write(new_data)
              print("✅ Basebin Hook Patched")
          else:
              print("⚠️ String TweakInject not found!")
          EOF
          strings "$HOOK_LIB" | grep "DiagInject" || (echo "❌ PATCH FAIL!"; exit 1)

      - name: 🛠️ PHASE 2: Crane Stealth (Surgical)
        run: |
          set -x
          # Tìm thư mục .app trong Payload
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          
          mkdir -p crane_work
          ar x Crane.deb --output=crane_work
          tar -xf crane_work/data.tar.* -C crane_work
          
          ORIG_DYLIB=$(find crane_work -name "Crane.dylib")
          PREFS_BIN=$(find crane_work -name "CranePrefs")
          
          python3 - <<EOF
          import os
          def patch_bin(path, old, new):
              if not os.path.exists(path): return
              with open(path, "rb") as f: data = f.read()
              if old in data:
                  with open(path, "wb") as f: f.write(data.replace(old, new))
          
          # com.opa334.crane (16) -> com.apple.diagsv1 (16)
          # Crane.dylib (11)      -> Diagsv1.dylib (11)
          files = ["$ORIG_DYLIB", "$PREFS_BIN"]
          for f in files:
              patch_bin(f, b"com.opa334.crane", b"com.apple.diagsv1")
              patch_bin(f, b"Crane.dylib", b"Diagsv1.dylib")
          EOF
          
          # Tạo thư mục ngoại lệ và di chuyển file
          mkdir -p "$APP_DIR/DiagInject"
          mv "$ORIG_DYLIB" "$APP_DIR/DiagInject/Diagsv1.dylib"
          ldid -S "$APP_DIR/DiagInject/Diagsv1.dylib"

      - name: 🎭 PHASE 3: App Stealth & Packaging
        run: |
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_DIR/Info.plist"
          
          # Fake Metadata theo style Apple
          plutil -replace CFBundleIdentifier -string "com.apple.diagsv1.manager" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "Diagnostics" "$INFO_PLIST"
          
          # Fake URL Schemes
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.diagsv1</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"
          
          # Xử lý File thực thi
          OLD_EXEC=$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")
          mv "$APP_DIR/$OLD_EXEC" "$APP_DIR/Diagnostics"
          plutil -replace CFBundleExecutable -string "Diagnostics" "$INFO_PLIST"
          
          # Sign & Pack
          rm -f "$APP_DIR/Assets.car"
          ldid -e "$APP_DIR/Diagnostics" > ent.xml
          ldid -Sent.xml "$APP_DIR/Diagnostics"
          
          cd temp && zip -qr ../Diagnostics_Final_Surgical.tipa Payload

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostics-Final-Surgical
          path: Diagnostics_Final_Surgical.tipa
