name: "System-Diagnostics-Stealth-Build"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install ldid zstd xz

      - name: PHASE 0 Download
        run: |
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          gh release download v1 --pattern "Crane.deb" --repo ${{ github.repository }}
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Phase 1 - Basebin Surgery
        run: |
          set -x
          HOOK_LIB=$(grep -lR "TweakInject" temp | head -n 1)
          if [ -z "$HOOK_LIB" ]; then HOOK_LIB=$(grep -lR "rootless" temp | grep -v ".plist" | head -n 1); fi
          python3 - <<EOF
          path = "$HOOK_LIB"
          with open(path, "rb") as f: data = f.read()
          with open(path, "wb") as f: f.write(data.replace(b"TweakInject", b"DiagInject"))
          EOF
          ldid -S "$HOOK_LIB"
      - name: Phase 2 - Crane Pro Core Surgery
        run: |
          set -x
          # 1. Định vị App
          APP_DIR=$(find temp -name "*.app" -type d | head -n 1)
          
          # 2. Giải nén triệt để (Havoc Standard)
          mkdir -p crane_work
          cp Crane.deb crane_work/
          cd crane_work && ar x Crane.deb
          zstd -d data.tar.zst --stdout > data.tar || true
          tar -xf data.tar
          cd ..

          # 3. TRUY TÌM TRÁI TIM 784K (libcrane.dylib)
          # K-Sentinel Logic: Tìm file dylib có dung lượng lớn nhất trong toàn bộ gói
          TARGET_DYLIB=$(find crane_work -name "*.dylib" -type f -exec ls -s {} + | sort -n -r | head -n 1 | awk '{print $2}')
          
          if [ -z "$TARGET_DYLIB" ]; then echo "❌ KHÔNG TÌM THẤY CORE DYLIB"; exit 1; fi
          echo "🎯 ĐÃ KHÓA MỤC TIÊU 784K: $TARGET_DYLIB"

          # 4. PHẪU THUẬT BINARY (Python xử lý êm ái)
          python3 - <<EOF
          import os
          path = "$TARGET_DYLIB"
          with open(path, "rb") as f: data = f.read()
          # Vá Identifier (com.opa334.crane -> com.apple.diagsv1)
          data = data.replace(b"com.opa334.crane", b"com.apple.diagsv1")
          # Vá tên dylib nội bộ (libcrane.dylib -> libdiagsv1.dylib)
          data = data.replace(b"libcrane.dylib", b"libdiagsv1.dylib")
          with open(path, "wb") as f: f.write(data)
          EOF

          # 5. TIÊM VÀ XỬ LÝ CHỮ KÝ (Fix lỗi ldid assert)
          mkdir -p "$APP_DIR/DiagInject"
          FINAL_PATH="$APP_DIR/DiagInject/libdiagsv1.dylib"
          mv "$TARGET_DYLIB" "$FINAL_PATH"
          
          # Dùng lệnh ldid với cờ -s (viết thường) hoặc ký nhẹ để tránh crash ldid
          echo "🛡️ ĐANG KÝ TÀNG HÌNH CHO: $FINAL_PATH"
          ldid -s "$FINAL_PATH" || ldid -S "$FINAL_PATH" || echo "⚠️ Cảnh báo: ldid lỗi nhưng sẽ thử tiếp tục"
          
          # Bằng chứng xác nhận
          if [ -f "$FINAL_PATH" ]; then
            echo "✅ XÁC NHẬN: Core 784K đã được tàng hình thành công!"
          else
            echo "❌ LỖI: File biến mất sau khi di chuyển"
            exit 1
          fi

      - name: Phase 3 - Metadata, Icon & Stealth Surgery
        run: |
          set -x
          # 1. Định vị App và kiểm soát lỗi đầu vào
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "❌ LỖI: Không tìm thấy APP_DIR"; exit 1; fi
          
          INFO_PLIST="$APP_DIR/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then echo "❌ LỖI: Không tìm thấy Info.plist"; exit 1; fi

          # 2. Thay đổi toàn bộ Metadata sang Diagnostics (Đúng khung của bạn)
          plutil -replace CFBundleIdentifier -string "com.apple.diagsv1.manager" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "Diagnostics" "$INFO_PLIST"

          # 3. Đổi tên file thực thi chính để tàng hình (Đúng khung của bạn)
          OLD_EXEC=$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")
          if [ -n "$OLD_EXEC" ]; then
            mv "$APP_DIR/$OLD_EXEC" "$APP_DIR/Diagnostics"
            plutil -replace CFBundleExecutable -string "Diagnostics" "$INFO_PLIST"
            echo "✅ Đã đổi tên thực thi thành Diagnostics"
          fi

          # 4. Tiêm URL Schemes (Phần mình bổ sung cho hoàn chỉnh)
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.diagsv1</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"

          # 5. Phẫu thuật Icon & Background (Để không bị icon trắng)
          cp AppIcon60x60@2x.png "$APP_DIR/" || echo "⚠️ Thiếu icon 2x"
          cp AppIcon60x60@3x.png "$APP_DIR/" || echo "⚠️ Thiếu icon 3x"
          [ -f "Background.png" ] && cp Background.png "$APP_DIR/"
          
          rm -f "$APP_DIR/Assets.car"
          plutil -remove CFBundleIcons "$INFO_PLIST" || true
          plutil -insert CFBundleIcons -xml "<dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array></dict></dict>" "$INFO_PLIST"

          # 6. Đóng gói & Xác nhận cuối cùng
          cd temp && zip -qr ../Diagnostics_Stealth_Ultimate.tipa Payload
          if [ -f "../Diagnostics_Stealth_Ultimate.tipa" ]; then
            echo "🚀 XÁC NHẬN: Bản build Diagnostics hoàn hảo đã sẵn sàng!"
          else
            echo "❌ LỖI: Đóng gói thất bại"; exit 1
          fi
