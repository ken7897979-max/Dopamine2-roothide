name: "System-Diagnostics-Stealth-Build"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Signing Tools
        run: brew install ldid

      - name: PHASE 0 - Download Assets
        run: |
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          gh release download v1 --pattern "Crane.deb" --repo ${{ github.repository }}
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Phase 1 - Basebin Surgery
        run: |
          set -x
          # Tìm file chứa TweakInject (Bản Roothide thường giấu trong file thực thi chính)
          HOOK_LIB=$(grep -lR "TweakInject" temp | head -n 1)
          
          if [ -z "$HOOK_LIB" ]; then
            echo "❌ Không tìm thấy mục tiêu!"
            exit 1
          fi
          
          echo "🎯 ĐÃ TÌM THẤY MỤC TIÊU: $HOOK_LIB"
          
          # Dùng Python để vá Binary (An toàn hơn sed)
          python3 - <<EOF
          import os
          path = "$HOOK_LIB"
          with open(path, "rb") as f:
              data = f.read()
          # TweakInject (11) -> DiagInject (11)
          if b"TweakInject" in data:
              new_data = data.replace(b"TweakInject", b"DiagInject")
              with open(path, "wb") as f:
                  f.write(new_data)
              print("✅ Vá thành công bằng Python")
          EOF
          
          # Ký lại file sau khi vá
          ldid -S "$HOOK_LIB"
          strings "$HOOK_LIB" | grep "DiagInject" && echo "✅ XÁC NHẬN: Basebin đã được khai thông!"

      - name: Phase 2 - Crane Surgery
        run: |
          set -x
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "❌ Không tìm thấy thư mục APP_DIR"
            exit 1
          fi
          
          mkdir -p crane_work
          cp Crane.deb crane_work/
          
          cd crane_work && ar x Crane.deb && tar -xf data.tar.* && cd ..
          
          DYLIB_P=$(find crane_work -name "Crane.dylib" | head -n 1)
          PREFS_P=$(find crane_work -name "CranePrefs" | head -n 1)
          
          if [ -z "$DYLIB_P" ]; then
            echo "❌ LỖI: Không giải nén được Crane.deb"
            exit 1
          fi
          
          # Phẫu thuật Crane (com.apple.diagsv1)
          sed -i '' 's/com.opa334.crane/com.apple.diagsv1/g' "$DYLIB_P"
          sed -i '' 's/Crane.dylib/Diagsv1.dylib/g' "$DYLIB_P"
          
          if [ -f "$PREFS_P" ]; then
            sed -i '' 's/com.opa334.crane/com.apple.diagsv1/g' "$PREFS_P"
            sed -i '' 's/Crane.dylib/Diagsv1.dylib/g' "$PREFS_P"
          fi
          
          # Tiêm vào vùng ngoại lệ
          mkdir -p "$APP_DIR/DiagInject"
          mv "$DYLIB_P" "$APP_DIR/DiagInject/Diagsv1.dylib"
          ldid -S "$APP_DIR/DiagInject/Diagsv1.dylib"
          echo "✅ XÁC NHẬN: Crane đã tàng hình!"

      - name: Phase 3 - Packaging
        run: |
          set -x
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_DIR/Info.plist"
          
          if [ -f "$INFO_PLIST" ]; then
            # Đổi Metadata tàng hình
            plutil -replace CFBundleIdentifier -string "com.apple.diagsv1.manager" "$INFO_PLIST"
            plutil -replace CFBundleDisplayName -string "Diagnostics" "$INFO_PLIST"
            
            # Đổi tên Binary chính
            OLD_EXEC=$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")
            mv "$APP_DIR/$OLD_EXEC" "$APP_DIR/Diagnostics"
            plutil -replace CFBundleExecutable -string "Diagnostics" "$INFO_PLIST"
            
            # Fake URL Schemes Apple
            plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.diagsv1</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"
            
            # Xóa Assets.car để fix icon trắng lưới
            rm -f "$APP_DIR/Assets.car"
            
            # Ký lại App
            ldid -e "$APP_DIR/Diagnostics" > ent.xml
            ldid -Sent.xml "$APP_DIR/Diagnostics"
            
            # Đóng gói sản phẩm
            cd temp && zip -qr ../Diagnostics_Stealth_Final.tipa Payload
            echo "🚀 HOÀN TẤT: Bản build tàng hình đã sẵn sàng!"
          else
            echo "❌ Lỗi không tìm thấy Info.plist"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostics-Final-Build
          path: Diagnostics_Stealth_Final.tipa
