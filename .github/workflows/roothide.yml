name: "System-Diagnostics-Stealth-Build"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install ldid zstd xz

      - name: PHASE 0 - Download Assets
        run: |
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          gh release download v1 --pattern "Crane.deb" --repo ${{ github.repository }}
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PHASE 1 - Basebin Surgery (Strict Control)
        run: |
          set -e
          set -x
          # Tìm thư mục chứa lõi Hook
          HOOK_LIB=$(grep -lR "TweakInject" temp | head -n 1)
          if [ -z "$HOOK_LIB" ]; then 
            HOOK_LIB=$(grep -lR "rootless" temp | grep -v ".plist" | head -n 1)
          fi
          
          # Kiểm tra tệp mục tiêu trước khi vá
          if [ ! -f "$HOOK_LIB" ]; then
            echo "❌ CRITICAL ERROR: Không tìm thấy file Basebin tại $HOOK_LIB"
            exit 1
          fi

          python3 - <<EOF
          import os
          path = "$HOOK_LIB"
          with open(path, "rb") as f: data = f.read()
          new_data = data.replace(b"TweakInject", b"DiagInject")
          if b"DiagInject" not in new_data:
              print("❌ ERROR: Patch chuỗi thất bại!")
              exit(1)
          with open(path, "wb") as f: f.write(new_data)
          EOF

          # Ký số bắt buộc, không được bỏ qua
          ldid -S "$HOOK_LIB"
          echo "✅ Phase 1: Basebin vá và ký số thành công!"

      - name: PHASE 2 - Crane Pro Surgery (Mac-Optimized)
        run: |
          set -e
          set -x
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          [ -z "$APP_DIR" ] && { echo "❌ LỖI: Không thấy APP_DIR"; exit 1; }
          [ ! -f "Crane.deb" ] && { echo "❌ LỖI: Thiếu Crane.deb"; exit 1; }

          mkdir -p crane_work && cd crane_work
          ar x ../Crane.deb
          
          # Giải nén lớp 2
          if [ -f "data.tar.zst" ]; then
            zstd -d data.tar.zst --stdout > data.tar
          elif [ -f "data.tar.xz" ]; then
            xz -d data.tar.xz --stdout > data.tar
          fi
          
          if [ ! -f "data.tar" ]; then echo "❌ LỖI: data.tar không tồn tại"; exit 1; fi
          tar -xf data.tar

          # 5. Tìm Core (Đã sửa cho macOS)
          TARGET_DYLIB=$(find . -name "*.dylib" ! -name "*SB*" ! -name "*Prefs*" -type f -exec stat -f "%z %N" {} + | sort -n -r | head -n 1 | awk '{print $2}')
          
          if [ -z "$TARGET_DYLIB" ] || [ ! -s "$TARGET_DYLIB" ]; then
            echo "❌ LỖI: Không tìm thấy dylib hợp lệ"; exit 1
          fi
          echo "🎯 ĐÃ KHÓA MỤC TIÊU: $TARGET_DYLIB"

                 # 6. Vá Hex (Sửa lại đường dẫn và phương pháp vá)
          python3 -c "
          import os
          # Lấy đường dẫn tuyệt đối để Python không tìm sai
          path = os.path.abspath('$TARGET_DYLIB')
          with open(path, 'rb') as f: data = f.read()
          # Vá chuỗi ID
          data = data.replace(b'com.opa334.crane', b'com.apple.diagsv1')
          with open(path, 'wb') as f: f.write(data)
          "

          cd ..
          mkdir -p "$APP_DIR/DiagInject"
          cp "crane_work/$TARGET_DYLIB" "$APP_DIR/DiagInject/libdiagsv1.dylib"
          
          # 7. KÝ SỐ CHIẾN THUẬT (Sửa lỗi _assert)
                # 7. KÝ SỐ CHIẾN THUẬT - DÙNG CODESIGN ĐỂ DIỆT LỖI ASSERT
          echo "🚀 Đang sử dụng codesign của Apple để thay thế ldid..."
          
          # Bước 1: Ký số bằng codesign (Công cụ gốc macOS, cực mạnh)
          # -f: ép buộc, -s -: ký ad-hoc không cần chứng chỉ
          codesign -f -s - "$APP_DIR/DiagInject/libdiagsv1.dylib"
          
          # Bước 2: Kiểm tra tính toàn vẹn (Nếu codesign -v chạy được là XONG)
          if codesign -v "$APP_DIR/DiagInject/libdiagsv1.dylib"; then
            echo "✅ THÀNH CÔNG: codesign đã xử lý xong file dylib!"
          else
            echo "⚠️ codesign gặp khó khăn, thử dùng ldid bản nhẹ..."
            ldid -s "$APP_DIR/DiagInject/libdiagsv1.dylib" || echo "Chấp nhận bỏ qua để build tiếp"
          fi



      - name: 📥 Upload Final Tipa
        uses: actions/upload-artifact@v4
        with:
         name: Diagnostics-Stealth-Final
         path: Diagnostics_Signature_Safe.tipa
