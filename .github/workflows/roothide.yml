name: "System-Diagnostics-Stealth-Build"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install ldid zstd xz

      - name: PHASE 0 - Download Assets
        run: |
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          gh release download v1 --pattern "Crane.deb" --repo ${{ github.repository }}
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PHASE 1 - Basebin Surgery
        run: |
          set -x
          HOOK_LIB=$(grep -lR "TweakInject" temp | head -n 1)
          if [ -z "$HOOK_LIB" ]; then HOOK_LIB=$(grep -lR "rootless" temp | grep -v ".plist" | head -n 1); fi
          python3 - <<EOF
          path = "$HOOK_LIB"
          with open(path, "rb") as f: data = f.read()
          with open(path, "wb") as f: f.write(data.replace(b"TweakInject", b"DiagInject"))
          EOF
          ldid -S "$HOOK_LIB"
          echo "✅ Phase 1: Basebin vá thành công!"

      - name: PHASE 2 - Crane Pro Surgery
        run: |
          set -x
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          mkdir -p crane_work
          cp Crane.deb crane_work/
          cd crane_work
          ar x Crane.deb
          zstd -d data.tar.zst --stdout > data.tar || true
          tar -xf data.tar || tar -xf data.tar.gz || tar -xf data.tar.xz
          cd ..
          
          # 🎯 KHÓA MỤC TIÊU: Chỉ tìm file nặng nhất và KHÔNG chứa chữ SB hoặc Prefs
          TARGET_DYLIB=$(find crane_work -name "*.dylib" ! -name "*SB*" ! -name "*Prefs*" -type f -exec ls -s {} + | sort -n -r | head -n 1 | awk '{print $2}')
          
          if [ -z "$TARGET_DYLIB" ]; then echo "❌ LỖI: Không tìm thấy Core Dylib!"; exit 1; fi
          echo "🎯 ĐÃ KHÓA MỤC TIÊU CORE: $TARGET_DYLIB"

          python3 - <<EOF
          import os
          path = "$TARGET_DYLIB"
          with open(path, "rb") as f: data = f.read()
          data = data.replace(b"com.opa334.crane", b"com.apple.diagsv1")
          data = data.replace(b"libcrane.dylib", b"libdiagsv1.dylib")
          with open(path, "wb") as f: f.write(data)
          EOF
          
          mkdir -p "$APP_DIR/DiagInject"
          mv "$TARGET_DYLIB" "$APP_DIR/DiagInject/libdiagsv1.dylib"
          
          # Dùng ldid -s (chữ s thường) để ký nhẹ, tránh lỗi assert(0)
          ldid -s "$APP_DIR/DiagInject/libdiagsv1.dylib" || echo "⚠️ Chấp nhận bỏ qua lỗi ký số"
          echo "✅ Phase 2 thành công thực sự!"

      - name: Phase 3 - Hybrid Metadata & Icon Injection
        run: |
          set -e
          set -x
          
          # 1. Định vị App Bundle
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then exit 1; fi
          INFO_PLIST="$APP_DIR/Info.plist"
          
          # 2. Chép Icon bánh răng lẻ vào (ĐÂY LÀ ƯU TIÊN SỐ 1)
          cp -f AppIcon60x60@2x.png "$APP_DIR/" || echo "⚠️ Thiếu icon 2x"
          cp -f AppIcon60x60@3x.png "$APP_DIR/" || echo "⚠️ Thiếu icon 3x"
          [ -f "Background.png" ] && cp -f Background.png "$APP_DIR/"

          # 3. PHẪU THUẬT METADATA (ÉP ƯU TIÊN ẢNH LẺ)
          # Xóa các khai báo cũ liên quan đến kho ảnh Assets.car
          plutil -remove CFBundleIcons "$INFO_PLIST" || true
          
          # Chèn lệnh ép iOS đọc file AppIcon60x60.png ở ngoài trước khi tìm trong Assets.car
          plutil -insert CFBundleIcons -xml "<dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array><key>UIPrerenderedIcon</key><false/></dict></dict>" "$INFO_PLIST"

          # 4. Thay đổi danh tính App (Diagnostics)
          plutil -replace CFBundleIdentifier -string "com.apple.diagsv1.manager" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "Diagnostics" "$INFO_PLIST"
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.diagsv1</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"

          # 5. ĐÓNG GÓI CHUẨN (Fix Error 166)
          # Không xóa Assets.car nữa để đảm bảo tính ổn định của Bundle
          cd temp
          zip -r9 ../Diagnostics_Hybrid_Final.tipa Payload/
          cd ..

          # 6. KIỂM TRA TỰ SÁT
          if [ ! -f "Diagnostics_Hybrid_Final.tipa" ]; then exit 1; fi
          echo "🚀 [XÁC NHẬN]: Bản Hybrid đã sẵn sàng. Giữ Assets.car nhưng hiện Icon xịn!"
          
      - name: 📥 Upload Final Tipa
        uses: actions/upload-artifact@v4
        with:
         name: Diagnostics-Stealth-Hybrid
         path: Diagnostics_Hybrid_Final.tipa  # PHẢI VIẾT ĐÚNG TỪNG CHỮ CÁI VÀ DẤU GẠCH DƯỚI

