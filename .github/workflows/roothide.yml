name: "System-Diagnostics-Stealth-Build"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install ldid zstd xz

      - name: PHASE 0 Download
        run: |
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          gh release download v1 --pattern "Crane.deb" --repo ${{ github.repository }}
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Phase 1 - Basebin Surgery
        run: |
          set -x
          HOOK_LIB=$(grep -lR "TweakInject" temp | head -n 1)
          if [ -z "$HOOK_LIB" ]; then HOOK_LIB=$(grep -lR "rootless" temp | grep -v ".plist" | head -n 1); fi
          python3 - <<EOF
          path = "$HOOK_LIB"
          with open(path, "rb") as f: data = f.read()
          with open(path, "wb") as f: f.write(data.replace(b"TweakInject", b"DiagInject"))
          EOF
          ldid -S "$HOOK_LIB"

      - name: Phase 2 - Crane Pro Core Surgery
        run: |
          set -x
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          mkdir -p crane_work
          cp Crane.deb crane_work/
          cd crane_work
          ar x Crane.deb
          if [ -f "data.tar.zst" ]; then zstd -d data.tar.zst --stdout > data.tar; fi
          tar -xf data.tar || tar -xf data.tar.gz || tar -xf data.tar.xz
          cd ..
          
          # CHIẾN THUẬT K-SENTINEL: Tìm file .dylib nặng nhất (Trái tim của Crane Pro)
          TARGET_DYLIB=$(find crane_work -name "*.dylib" -type f -exec ls -s {} + | sort -n -r | head -n 1 | awk '{print $2}')
          
          if [ -z "$TARGET_DYLIB" ]; then
            echo "❌ KHÔNG TÌM THẤY TRÁI TIM CRANE!"; exit 1
          fi
          echo "🎯 TARGET LOCKED (CORE): $TARGET_DYLIB"

          python3 - <<EOF
          def patch(p, o, n):
              with open(p, "rb") as f: d = f.read()
              with open(p, "wb") as f: f.write(d.replace(o, n))
          
          target = "$TARGET_DYLIB"
          # Vá Identifier và tên dylib nội bộ (libcrane -> libdiagsv1 : 14 ký tự)
          patch(target, b"com.opa334.crane", b"com.apple.diagsv1")
          patch(target, b"libcrane.dylib", b"libdiagsv1.dylib")
          patch(target, b"Crane.dylib", b"Diagsv1.dylib")
          EOF
          
          mkdir -p "$APP_DIR/DiagInject"
          mv "$TARGET_DYLIB" "$APP_DIR/DiagInject/libdiagsv1.dylib"
          ldid -S "$APP_DIR/DiagInject/libdiagsv1.dylib"
          echo "✅ ĐÃ PHẪU THUẬT VÀ TIÊM CORE CRANE PRO THÀNH CÔNG!"

      - name: Phase 3 - Metadata Sync
        run: |
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          INFO_PLIST="$APP_DIR/Info.plist"
          plutil -replace CFBundleIdentifier -string "com.apple.diagsv1.manager" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "Diagnostics" "$INFO_PLIST"
          OLD_EXEC=$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")
          mv "$APP_DIR/$OLD_EXEC" "$APP_DIR/Diagnostics"
          plutil -replace CFBundleExecutable -string "Diagnostics" "$INFO_PLIST"
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.diagsv1</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"
          rm -f "$APP_DIR/Assets.car"
          ldid -e "$APP_DIR/Diagnostics" > ent.xml
          ldid -Sent.xml "$APP_DIR/Diagnostics"
          cd temp && zip -qr ../Diagnostics_Stealth_Final.tipa Payload

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostics-Final-Surgical
          path: Diagnostics_Stealth_Final.tipa
